{% extends "base.html" %}
{% block title %}Register - LifeDrop BD{% endblock %}
{% block content %}

<div class="row justify-content-center">
<div class="col-md-7">
  <h3 class="mb-4">Register as a Donor</h3>
  <form method="POST" class="card card-body shadow-sm">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Full Name</label>
        <input type="text" name="name" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Phone</label>
        <input type="text" name="phone" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required minlength="6">
      </div>
      <div class="col-md-4">
        <label class="form-label">Blood Group</label>
        <select name="blood_group" class="form-select" required>
          {% for g in blood_groups %}<option value="{{ g }}">{{ g }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Gender</label>
        <select name="gender" class="form-select" required>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Age</label>
        <input type="number" name="age" min="18" max="65" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Area</label>
        <input type="text" name="area" class="form-control" placeholder="e.g. Mirpur" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">District</label>
        <input type="text" name="district" class="form-control" value="Dhaka">
      </div>
    </div>
    <button type="submit" class="btn btn-danger mt-4">Register</button>
    <p class="mt-3 mb-0 text-muted">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </form>
</div>
</div>

{% endblock %}
